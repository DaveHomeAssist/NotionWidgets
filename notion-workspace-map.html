<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Map | Dave's Notion Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #080c14;
      --surface:  #0e1524;
      --panel:    #131e30;
      --panel-2:  #192437;
      --border:   rgba(255,255,255,0.07);
      --muted:    #7a90b8;
      --text:     #e8eef8;
      --shadow:   0 20px 60px rgba(0,0,0,0.4);
      --radius:   16px;
      --radius-sm:10px;

      /* Layer accent colours */
      --c-hub:      #818cf8; /* indigo */
      --c-software: #34d399; /* emerald */
      --c-db:       #38bdf8; /* sky */
      --c-page:     #a78bfa; /* violet */
      --c-home:     #fb923c; /* orange */
      --c-life:     #f472b6; /* pink */
      --c-gov:      #facc15; /* yellow */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
    }

    body { padding: 20px; }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    /* ── Hero ── */
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(129,140,248,0.1);
      color: #a5b4fc;
      border: 1px solid rgba(129,140,248,0.22);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(26px, 3.5vw, 40px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .hero p { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 60ch; }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      text-align: center;
    }

    .stat-val { font-size: 26px; font-weight: 800; font-family: 'DM Mono', monospace; }
    .stat-lbl { color: var(--muted); font-size: 11px; margin-top: 3px; letter-spacing: 0.03em; }

    /* ── Toolbar ── */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .field {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      flex: 1;
      min-width: 160px;
    }

    .field label { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; font-family: 'DM Mono', monospace; margin-bottom: 4px; }
    .field input, .field select { width: 100%; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; }
    .field select option { background: var(--panel); }

    .segmented {
      display: flex;
      gap: 4px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
    }

    .segmented button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
      transition: all 140ms ease;
    }

    .segmented button.active, .segmented button:hover {
      background: rgba(129,140,248,0.15);
      color: var(--text);
    }

    .reset-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      padding: 9px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
      transition: color 140ms ease;
    }

    .reset-btn:hover { color: var(--text); }

    /* ── Main layout ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
      align-items: start;
    }

    /* ── Canvas ── */
    .canvas {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .canvas-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .canvas-title { font-size: 15px; font-weight: 800; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-family: 'DM Mono', monospace;
    }

    .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }

    .map-wrap {
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      background: radial-gradient(circle at 20% 20%, rgba(129,140,248,0.06), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(52,211,153,0.05), transparent 40%),
                  #080d18;
      max-height: 78vh;
    }

    svg {
      width: 100%;
      min-width: 1440px;
      height: auto;
      display: block;
    }

    .grid-bg { fill: url(#grid); }

    .edge {
      fill: none;
      stroke: rgba(120,140,180,0.22);
      stroke-width: 1.5;
    }

    .edge.highlight {
      stroke: rgba(129,140,248,0.7);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 5px rgba(129,140,248,0.25));
    }

    .node { cursor: pointer; }

    .node .bg {
      fill: rgba(13,20,36,0.95);
      stroke: rgba(255,255,255,0.09);
      stroke-width: 1;
      transition: stroke 150ms ease, filter 150ms ease;
    }

    .node:hover .bg { stroke: rgba(255,255,255,0.22); }

    .node.selected .bg {
      stroke: rgba(129,140,248,0.85);
      stroke-width: 1.8;
      filter: drop-shadow(0 0 18px rgba(129,140,248,0.18));
    }

    .node.dimmed { pointer-events: none; opacity: 0.1 !important; }

    .node .n-type {
      font-family: 'DM Mono', monospace;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .node .n-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      fill: #e8eef8;
    }

    .node .n-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      fill: #7a90b8;
    }

    /* ── Detail panel ── */
    .detail {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .detail::-webkit-scrollbar { width: 4px; }
    .detail::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }

    .d-stack { display: grid; gap: 10px; }

    .d-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    .d-kicker {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #a5b4fc;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .d-title { font-size: 20px; font-weight: 800; margin: 6px 0 8px; letter-spacing: -0.01em; line-height: 1.1; }
    .d-desc { color: var(--muted); font-size: 13px; line-height: 1.55; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }

    .kv {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .kv:last-child { border-bottom: 0; }
    .kv .k { color: var(--muted); font-size: 12px; }
    .kv .v { font-weight: 600; word-break: break-all; }

    .d-list { margin: 4px 0 0 16px; }
    .d-list li { color: var(--muted); font-size: 13px; padding: 2px 0; line-height: 1.45; }

    .notion-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      color: #818cf8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      font-family: 'DM Mono', monospace;
    }

    .notion-link:hover { text-decoration: underline; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

    @media (max-width: 1100px) {
      .main { grid-template-columns: 1fr; }
      .detail { position: static; max-height: none; }
      .hero { grid-template-columns: 1fr; }
      .hero-stats { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .hero-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

      type: 'Database',
      status: 'Active',
      x: 1030, y: 720,
      url: 'https://notion.so/5200d1e8d4c54a0699758f8f9b53db8d',
      desc: 'Tracks creative projects separate from software. Used within HUB | Creative Projects.',
      children: [],
      tags: ['database', 'creative', 'projects'],
    },
    {
      id: 'db-projects-home',
      name: 'DB | Projects (Robertsons)',
      layer: 'Database',
      type: 'Database',
      status: 'Active',
      x: 1280, y: 720,
      url: 'https://notion.so/584a7ccebb0f41e5b046e4e6a1dc0a95',
      desc: 'Home and family projects database used within HUB | Home Life.',
      children: [],
      tags: ['database', 'home', 'family', 'projects'],
    },
  ];

  /* ─────────────────────────────────────────
     Explicit edges (source → target)
  ───────────────────────────────────────── */
  const edges = [
    // HOME → area hubs
    ['home-dashboard', 'tech-ai'],
    ['home-dashboard', 'work-career'],
    ['home-dashboard', 'home-family'],

    // Area hubs → sub-hubs
    ['tech-ai', 'software-dev'],
    ['tech-ai', 'hub-technology'],
    ['work-career', 'creative-hub'],
    ['home-family', 'home-hub'],
    ['home-family', 'hub-home-env'],
    ['hub-technology', 'hub-tech-tools'],
    ['hub-home-env', 'hub-workshop'],

    // Software Dev control panel → databases
    ['software-dev', 'db-ai-projects'],
    ['software-dev', 'db-dev-work'],
    ['software-dev', 'db-bugs'],
    ['software-dev', 'db-capture'],
    ['software-dev', 'db-decisions'],

    // Software Dev → project brief pages
    ['software-dev', 'sft-promptlab'],
    ['software-dev', 'sft-garden-os'],

    // Data flow: Capture → Dev Work & Decisions
    ['db-capture', 'db-dev-work'],
    ['db-capture', 'db-decisions'],

    // Dev Work & Bugs → AI Projects (relation)
    ['db-dev-work', 'db-ai-projects'],
    ['db-bugs', 'db-ai-projects'],
    ['db-decisions', 'db-ai-projects'],

    // Naming feeds Decisions
    ['db-naming', 'db-decisions'],

    // Context Templates → Capture / Software Dev
    ['db-context', 'db-capture'],
    ['db-context', 'software-dev'],

    // Garden hub → Garden OS brief
    ['hub-workshop', 'sft-garden-os'],

    // Creative hub → creative DB
    ['creative-hub', 'db-creative'],

    // Home hub → home projects DB
    ['home-hub', 'db-projects-home'],

    // Projects DB ties to Software Dev as subsystem registry
    ['software-dev', 'db-projects'],
  ];

  /* ─────────────────────────────────────────
     State
  ───────────────────────────────────────── */
  const state = {
    search: '',
    layer: 'All',
    type: 'All',
    focus: 'All',
    selectedId: 'home-dashboard',
  };

  /* ─────────────────────────────────────────
     Helpers
  ───────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const esc = str => { const el = document.createElement('span'); el.textContent = str; return el.innerHTML; };
  const unique = arr => ['All', ...new Set(arr)];

  function populateSelect(el, values) {
    el.innerHTML = '';
    for (const v of values) {
      const o = document.createElement('option');
      o.value = o.textContent = v;
      el.appendChild(o);
    }
  }

  /* ─────────────────────────────────────────
     Filter
  ───────────────────────────────────────── */
  function filteredNodes() {
    return nodes.filter(n => {
      const hay = [n.name, n.layer, n.type, ...n.tags].join(' ').toLowerCase();
      if (state.search && !hay.includes(state.search.toLowerCase())) return false;
      if (state.layer !== 'All' && n.layer !== state.layer) return false;
      if (state.type !== 'All' && n.type !== state.type) return false;

      switch (state.focus) {
        case 'Software Stack': return ['Hub','Database','Page'].includes(n.layer) &&
          ['software-dev','db-ai-projects','db-dev-work','db-bugs','db-capture','db-decisions','db-naming','db-context','db-projects','sft-promptlab','sft-garden-os','tech-ai','hub-technology','hub-tech-tools','home-dashboard'].includes(n.id);
        case 'Data Flow':  return ['Database'].includes(n.layer) || n.id === 'software-dev';
        case 'Hubs Only':  return n.layer === 'Hub';
        case 'Governance': return n.type === 'Database' && ['db-decisions','db-naming','db-context'].includes(n.id) || n.id === 'software-dev';
        default:           return true;
      }
    });
  }

  /* ─────────────────────────────────────────
     Render: Hero stats
  ───────────────────────────────────────── */
  function renderStats(vis) {
    const defs = [
      ['Visible', vis.length],
      ['Hubs',    vis.filter(n => n.layer === 'Hub').length],
      ['DBs',     vis.filter(n => n.layer === 'Database').length],
      ['Pages',   vis.filter(n => n.layer === 'Page').length],
    ];
    $('heroStats').innerHTML = defs.map(([l, v]) => `
      <div class="stat">
        <div class="stat-val">${v}</div>
        <div class="stat-lbl">${l}</div>
      </div>`).join('');
  }

  /* ─────────────────────────────────────────
     Render: Legend
  ───────────────────────────────────────── */
  function renderLegend() {
    $('legend').innerHTML = Object.entries(layers).map(([name, color]) =>
      `<span class="legend-item"><span class="dot" style="background:${color}"></span>${name}</span>`
    ).join('');
  }

  /* ─────────────────────────────────────────
     Render: Focus modes
  ───────────────────────────────────────── */
  function renderFocusModes() {
    const modes = ['All', 'Software Stack', 'Data Flow', 'Hubs Only', 'Governance'];
    $('focusModes').innerHTML = '';
    for (const m of modes) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = m;
      if (state.focus === m) b.classList.add('active');
      b.addEventListener('click', () => { state.focus = m; render(); });
      $('focusModes').appendChild(b);
    }
  }

  /* ─────────────────────────────────────────
     Render: SVG map
  ───────────────────────────────────────── */
  function renderMap(vis) {
    const visIds = new Set(vis.map(n => n.id));
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    const frag = [];

    // Grid defs
    frag.push(`
      <defs>
        <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
          <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1440" height="860" class="grid-bg"/>
    `);

    // Row labels
    const rowLabels = [
      { y: 18,  label: 'WORKSPACE ENTRY' },
      { y: 178, label: 'AREA HUBS' },
      { y: 358, label: 'CONTROL PANELS & PROJECT HUBS' },
      { y: 533, label: 'DATABASES' },
      { y: 708, label: 'PROJECT BRIEFS & SUPPORTING DBs' },
    ];
    for (const {y, label} of rowLabels) {
      frag.push(`<text x="18" y="${y}" fill="rgba(120,144,184,0.3)" font-size="9" font-weight="700" letter-spacing="0.1em" font-family="DM Mono, monospace">${esc(label)}</text>`);
    }

    // Edges
    for (const [a, b] of edges) {
      const na = byId[a], nb = byId[b];
      if (!na || !nb) continue;
      const show = visIds.has(a) && visIds.has(b);
      const hi = show && (a === state.selectedId || b === state.selectedId);
      const x1 = na.x + NW / 2, y1 = na.y + NH;
      const x2 = nb.x + NW / 2, y2 = nb.y;
      const my = (y1 + y2) / 2;
      frag.push(`<path class="edge${hi ? ' highlight' : ''}" d="M${x1} ${y1} C${x1} ${my},${x2} ${my},${x2} ${y2}" style="opacity:${show ? (hi ? 1 : 0.5) : 0.04}"/>`);
    }

    // Nodes
    for (const n of nodes) {
      const vis = visIds.has(n.id);
      const col = layers[n.layer] || '#818cf8';
      const sel = n.id === state.selectedId;
      frag.push(`
        <g class="node${sel ? ' selected' : ''}${!vis ? ' dimmed' : ''}"
           data-id="${esc(n.id)}"
           data-interactive="${vis}"
           transform="translate(${n.x},${n.y})"
           tabindex="${vis ? 0 : -1}"
           ${vis ? `role="button" aria-label="${esc(n.name)}"` : 'aria-hidden="true"'}>
          <rect class="bg" width="${NW}" height="${NH}" rx="14"/>
          <rect x="14" y="13" width="40" height="6" rx="999" fill="${col}" opacity="0.85"/>
          <text class="n-type" x="14" y="31" fill="${col}">${esc(n.type)}</text>
          <text class="n-title" x="14" y="52">${esc(n.name.length > 26 ? n.name.slice(0, 25) + '…' : n.name)}</text>
          <text class="n-sub" x="14" y="70">${esc(n.layer)} · ${esc(n.status)}</text>
          <text class="n-sub" x="14" y="84">${n.tags.slice(0,2).map(t => '#'+t).join(' ')}</text>
        </g>
      `);
    }

    $('map').innerHTML = frag.join('');
    $('canvasTitle').textContent = vis.length
      ? (state.focus === 'All' ? 'Full Topology' : state.focus)
      : 'No matching nodes';
  }

  /* ─────────────────────────────────────────
     Render: Detail panel
  ───────────────────────────────────────── */
  function renderDetail(vis) {
    if (!vis.length) {
      $('detailPanel').innerHTML = `<div class="d-card"><div class="d-kicker">No results</div><p class="d-desc" style="margin-top:8px">Adjust filters to restore the map.</p></div>`;
      return;
    }

    const n = vis.find(x => x.id === state.selectedId) || vis[0];
    state.selectedId = n.id;

    const col = layers[n.layer] || '#818cf8';

    const related = edges
      .filter(([a, b]) => a === n.id || b === n.id)
      .map(([a, b]) => a === n.id ? b : a)
      .map(id => nodes.find(x => x.id === id))
      .filter(Boolean);

    $('detailPanel').innerHTML = `
      <div class="d-card">
        <div class="d-kicker">${esc(n.layer)} · ${esc(n.type)}</div>
        <div class="d-title">${esc(n.name)}</div>
        <p class="d-desc">${esc(n.desc)}</p>
        <div class="chips">
          <span class="chip" style="color:${col};border-color:${col}30">${esc(n.layer)}</span>
          <span class="chip">${esc(n.status)}</span>
        </div>
        ${n.url ? `<a class="notion-link" href="${esc(n.url)}" target="_blank" rel="noopener">↗ Open in Notion</a>` : ''}
      </div>

      <div class="d-card">
        <div class="kv"><div class="k">Type</div><div class="v">${esc(n.type)}</div></div>
        <div class="kv"><div class="k">Layer</div><div class="v">${esc(n.layer)}</div></div>
        <div class="kv"><div class="k">Status</div><div class="v">${esc(n.status)}</div></div>
        <div class="kv"><div class="k">Tags</div><div class="v">${n.tags.join(', ')}</div></div>
      </div>

      <div class="d-card">
        <div class="d-kicker">Connected (${related.length})</div>
        <ul class="d-list" style="margin-top:6px">
          ${related.length
            ? related.map(r => `<li>${esc(r.name)} <span style="color:#4b607a">(${esc(r.layer)})</span></li>`).join('')
            : '<li>No connections</li>'}
        </ul>
      </div>

      <div class="d-card">
        <div class="d-kicker">Tags</div>
        <div class="chips" style="margin-top:6px">
          ${n.tags.map(t => `<span class="chip">#${esc(t)}</span>`).join('')}
        </div>
      </div>
    `;
  }

  /* ─────────────────────────────────────────
     Main render
  ───────────────────────────────────────── */
  function render() {
    renderFocusModes();
    const vis = filteredNodes();
    const visIds = new Set(vis.map(n => n.id));
    if (!visIds.has(state.selectedId)) state.selectedId = vis[0]?.id ?? null;
    renderStats(vis);
    renderMap(vis);
    renderDetail(vis);
  }

  /* ─────────────────────────────────────────
     Init
  ───────────────────────────────────────── */
  populateSelect($('layerFilter'), unique(nodes.map(n => n.layer)));
  populateSelect($('typeFilter'), unique(nodes.map(n => n.type)));
  renderLegend();

  $('map').addEventListener('click', e => {
    const g = e.target.closest('.node[data-interactive="true"]');
    if (!g) return;
    state.selectedId = g.dataset.id;
    render();
  });

  $('map').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const g = e.target.closest('.node[data-interactive="true"]');
    if (!g) return;
    e.preventDefault();
    state.selectedId = g.dataset.id;
    render();
  });

  let t;
  $('search').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => { state.search = e.target.value.trim(); render(); }, 120);
  });

  $('layerFilter').addEventListener('change', e => { state.layer = e.target.value; render(); });
  $('typeFilter').addEventListener('change', e => { state.type = e.target.value; render(); });

  $('resetBtn').addEventListener('click', () => {
    clearTimeout(t);
    Object.assign(state, { search: '', layer: 'All', type: 'All', focus: 'All', selectedId: 'home-dashboard' });
    $('search').value = '';
    $('layerFilter').value = 'All';
    $('typeFilter').value = 'All';
    render();
  });

  render();
  </script>
</body>
</html>
