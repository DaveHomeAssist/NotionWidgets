name: CI

# Audit M-3: legacy Pages published every push with no test gate.
# This workflow runs static checks on every push and PR, and Pages now
# deploys only from the gated deploy job (build_type: workflow).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Site checks (JSON datasets, HTML sanity, internal links, public-data guard)
        run: node scripts/check-site.mjs

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site artifact (parity with legacy Jekyll exclusions)
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='_*' --exclude='.*' ./ /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
