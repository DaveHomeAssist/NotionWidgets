<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Approval Hub</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon/apple-touch-icon.png" />
<style>
  :root {
    --bg: #09090e;
    --surface: #111118;
    --surface-2: #1a1a24;
    --surface-3: #222233;
    --border: #2a2a3d;
    --border-focus: #4a4a6a;
    --text: #e8e8f2;
    --text-dim: #6e6e8a;
    --approve: #34d399;
    --approve-glow: rgba(52, 211, 153, 0.25);
    --approve-bg: rgba(52, 211, 153, 0.08);
    --revise: #fbbf24;
    --revise-glow: rgba(251, 191, 36, 0.25);
    --revise-bg: rgba(251, 191, 36, 0.08);
    --restart: #f87171;
    --restart-glow: rgba(248, 113, 113, 0.25);
    --restart-bg: rgba(248, 113, 113, 0.08);
    --accent: #818cf8;
    --accent-glow: rgba(129, 140, 248, 0.25);
    --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f8;
      --surface: #ffffff;
      --surface-2: #f0f0f6;
      --surface-3: #e8e8f0;
      --border: #d4d4e0;
      --border-focus: #b0b0c8;
      --text: #1a1a2e;
      --text-dim: #7a7a96;
      --approve-bg: rgba(52, 211, 153, 0.12);
      --revise-bg: rgba(251, 191, 36, 0.12);
      --restart-bg: rgba(248, 113, 113, 0.12);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto; /* Phase 1: was overflow:hidden — clipped content on short viewports */
  }

  .approval-panel {
    width: 100%;
    max-width: 500px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }

  .approval-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, var(--approve), var(--accent), var(--revise));
    z-index: 2;
  }

  .panel-body {
    padding: 28px;
  }

  /* ─── HEADER ─── */
  .ap-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .ap-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .ap-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  .round-badge {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-mono);
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  /* ─── DELIVERABLES ─── */
  .deliverables {
    margin-bottom: 22px;
  }

  .deliv-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    font-family: var(--font-mono);
    margin-bottom: 8px;
  }

  .deliv-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .deliv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    opacity: 0;
    transform: translateY(6px);
    animation: fade-up 0.4s ease forwards;
    cursor: default;
    transition: border-color 0.2s, background 0.2s;
  }

  .deliv-item:hover {
    border-color: var(--border-focus);
    background: var(--surface-3);
  }

  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }

  .deliv-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    background: var(--surface-3);
  }

  .deliv-info { flex: 1; min-width: 0; }

  .deliv-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .deliv-meta {
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  .deliv-status {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-mono);
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .status-approved { background: var(--approve-bg); color: var(--approve); }
  .status-revisions { background: var(--revise-bg); color: var(--revise); }
  .status-pending { background: var(--surface-3); color: var(--text-dim); }
  .status-restart { background: var(--restart-bg); color: var(--restart); }

  /* ─── APPROVAL ACTIONS ─── */
  .action-section {
    margin-bottom: 20px;
  }

  .action-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    font-family: var(--font-mono);
    margin-bottom: 10px;
  }

  .action-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 10px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: var(--font-sans);
  }

  .action-btn:hover { transform: translateY(-2px); }

  .action-btn.approve-btn:hover, .action-btn.approve-btn.is-selected {
    border-color: var(--approve);
    background: var(--approve-bg);
    box-shadow: 0 0 20px var(--approve-glow);
  }

  .action-btn.revise-btn:hover, .action-btn.revise-btn.is-selected {
    border-color: var(--revise);
    background: var(--revise-bg);
    box-shadow: 0 0 20px var(--revise-glow);
  }

  .action-btn.restart-btn:hover, .action-btn.restart-btn.is-selected {
    border-color: var(--restart);
    background: var(--restart-bg);
    box-shadow: 0 0 20px var(--restart-glow);
  }

  .action-icon { font-size: 24px; }

  .action-text {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ─── FEEDBACK TEXTAREA ─── */
  .feedback-section {
    margin-bottom: 18px;
    display: none;
  }

  .feedback-section.is-visible { display: block; }

  .feedback-area {
    width: 100%;
    min-height: 80px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  .feedback-area:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .feedback-area::placeholder { color: var(--text-dim); }

  .feedback-hint {
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    margin-top: 6px;
  }

  /* ─── SUBMIT ─── */
  .submit-row {
    gap: 10px; /* Phase 1: removed dead display:flex (was immediately overridden by display:none below) */
    display: none;
  }

  .submit-row.is-visible { display: flex; }

  .submit-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .submit-btn.primary {
    background: var(--accent);
    color: #fff;
  }

  .submit-btn.primary:hover {
    box-shadow: 0 0 24px var(--accent-glow);
    transform: translateY(-1px);
  }

  .submit-btn.ghost {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  /* ─── TIMELINE ─── */
  .timeline-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .timeline-item {
    display: flex;
    gap: 12px;
    padding: 6px 0;
    font-size: 12px;
  }

  .tl-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .tl-dot.approved { background: var(--approve); box-shadow: 0 0 6px var(--approve-glow); }
  .tl-dot.revisions { background: var(--revise); box-shadow: 0 0 6px var(--revise-glow); }
  .tl-dot.pending { background: var(--text-dim); }
  .tl-dot.submitted { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .tl-dot.restart { background: var(--restart); box-shadow: 0 0 6px var(--restart-glow); }

  .tl-content { flex: 1; }

  .tl-text { color: var(--text); font-weight: 500; }
  .tl-date {
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    margin-top: 1px;
  }

  /* ─── SUCCESS OVERLAY ─── */
  .success-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
    border-radius: 20px;
    animation: overlay-in 0.4s ease;
  }

  .success-overlay.is-visible { display: flex; }

  @keyframes overlay-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .success-icon {
    font-size: 48px;
    animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes pop-in {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  .success-text {
    font-size: 18px;
    font-weight: 700;
  }

  .success-sub {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  /* ─── ERROR STATE ─── */
  .error-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--restart-bg);
    border: 1px solid var(--restart);
    font-size: 12px;
    color: var(--restart);
    margin-bottom: 12px;
    font-family: var(--font-mono);
  }

  .error-bar.is-visible { display: flex; }

  /* ─── DECISION RECORD ─── */
  .decision-record {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--approve-bg);
    border: 1px solid var(--approve);
    font-size: 12px;
    color: var(--text);
    margin-bottom: 12px;
  }

  .decision-record.is-visible { display: flex; }

  .decision-record .dr-text { font-family: var(--font-mono); line-height: 1.4; }
  .decision-record .dr-text strong { color: var(--approve); }

  .decision-record .dr-copy {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    font-family: var(--font-sans);
    cursor: pointer;
  }

  .decision-record .dr-copy:hover { border-color: var(--border-focus); }

  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="approval-panel" id="panel">
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon" id="successIcon">✅</div>
    <div class="success-text" id="successText">Feedback Submitted</div>
    <div class="success-sub" id="successSub">Your response has been recorded</div>
  </div>

  <div class="panel-body">
    <div class="ap-header">
      <div>
        <div class="ap-title" id="apTitle">Creative Review</div>
        <div class="ap-subtitle" id="apSubtitle">Website Redesign — Homepage</div>
      </div>
      <div class="round-badge" id="roundBadge">Round 2</div>
    </div>

    <div class="deliverables">
      <div class="deliv-label">Deliverables</div>
      <div class="deliv-grid" id="delivGrid"></div>
    </div>

    <div class="action-section">
      <div class="action-label">Your Decision</div>
      <div class="action-buttons" id="actionBtns">
        <button class="action-btn approve-btn" data-action="approve" aria-label="Approve deliverables" aria-pressed="false">
          <span class="action-icon">👍</span>
          <span class="action-text">Approve</span>
        </button>
        <button class="action-btn revise-btn" data-action="revisions" aria-label="Request revisions" aria-pressed="false">
          <span class="action-icon">✏️</span>
          <span class="action-text">Revisions</span>
        </button>
        <button class="action-btn restart-btn" data-action="restart" aria-label="Request restart" aria-pressed="false">
          <span class="action-icon">↩️</span>
          <span class="action-text">Restart</span>
        </button>
      </div>
    </div>

    <div class="feedback-section" id="feedbackSection">
      <textarea class="feedback-area" id="feedbackArea" aria-label="Feedback details" placeholder="Add your feedback, revision notes, or questions..."></textarea>
      <div class="feedback-hint">Be specific — reference sections, colors, copy, or layouts</div>
    </div>

    <div class="error-bar" id="errorBar" role="alert" aria-live="polite"></div>

    <div class="decision-record" id="decisionRecord" role="status" aria-live="polite">
      <div class="dr-text" id="decisionRecordText"></div>
      <button class="dr-copy" id="decisionCopyBtn" aria-label="Copy decision summary to clipboard">Copy summary</button>
    </div>

    <div class="submit-row" id="submitRow">
      <button class="submit-btn ghost" id="cancelBtn" aria-label="Cancel this response">Cancel</button>
      <button class="submit-btn primary" id="submitBtn" aria-label="Submit feedback to parent embed">Submit Feedback</button>
    </div>

    <div class="timeline-section">
      <div class="deliv-label">Activity</div>
      <div id="timeline"></div>
    </div>
  </div>
</div>

<script>
  const P = new URLSearchParams(window.location.search);
  const initErrors = [];
  const VALID_TYPES = new Set(['design', 'copy', 'dev', 'video', 'doc', 'motion', 'photo', 'brand', 'audio']);
  const VALID_STATUSES = new Set(['approved', 'revisions', 'pending', 'restart']);
  const VALID_TL_TYPES = new Set(['approved', 'revisions', 'pending', 'submitted', 'restart']);
  const TYPE_ALIASES = Object.freeze({ document: 'doc' });
  const STATUS_ALIASES = Object.freeze({ revision: 'revisions', rejected: 'restart' });
  const TL_TYPE_ALIASES = Object.freeze({
    active: 'submitted',
    completed: 'approved',
    revision: 'revisions',
    rejected: 'restart'
  });
  const STATUS_LABELS = Object.freeze({
    approved: 'Approved',
    revisions: 'Revisions',
    pending: 'Pending',
    restart: 'Restart'
  });
  const DEFAULT_DELIVERABLES = [
    { name: 'Homepage mockup', type: 'design', status: 'approved' },
    { name: 'Hero animation', type: 'motion', status: 'pending' },
    { name: 'Mobile responsive', type: 'design', status: 'revisions' },
    { name: 'Copy & headlines', type: 'copy', status: 'restart' }
  ];
  const DEFAULT_TIMELINE = [
    { text: 'Round 1 submitted', type: 'submitted', date: 'Mar 1' },
    { text: 'Logo approved', type: 'approved', date: 'Mar 3' },
    { text: 'Revisions requested on hero', type: 'revisions', date: 'Mar 4' },
    { text: 'Restart requested on copy set', type: 'restart', date: 'Mar 6' },
    { text: 'Round 2 submitted', type: 'submitted', date: 'Mar 8' }
  ];

  function normalizeToken(raw, aliases, valid, fallback) {
    const token = typeof raw === 'string' ? raw.trim().toLowerCase() : '';
    const canonical = aliases[token] || token;
    return valid.has(canonical) ? canonical : fallback;
  }

  function parseJsonArrayParam(raw, fallback, keyName) {
    if (!raw) return fallback;
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('Expected JSON array');
      return parsed;
    } catch (_) {
      initErrors.push(`Invalid ${keyName} parameter JSON. Using defaults.`);
      return fallback;
    }
  }

  function normalizeDeliverables(items) {
    return items.map(item => {
      const obj = item && typeof item === 'object' ? item : {};
      const name = typeof obj.name === 'string' && obj.name.trim() ? obj.name.trim() : 'Untitled deliverable';
      const type = normalizeToken(obj.type, TYPE_ALIASES, VALID_TYPES, 'design');
      const status = normalizeToken(obj.status, STATUS_ALIASES, VALID_STATUSES, 'pending');
      return { name, type, status };
    });
  }

  function normalizeTimeline(items) {
    return items.map(item => {
      const obj = item && typeof item === 'object' ? item : {};
      const text = typeof obj.text === 'string' && obj.text.trim() ? obj.text.trim() : 'Activity update';
      const type = normalizeToken(obj.type, TL_TYPE_ALIASES, VALID_TL_TYPES, 'pending');
      const date = typeof obj.date === 'string' ? obj.date.trim() : '';
      return { text, type, date };
    });
  }

  const config = {
    title: P.get('title') || 'Creative Review',
    subtitle: P.get('subtitle') || 'Website Redesign — Homepage',
    round: Math.max(1, Math.min(99, parseInt(P.get('round'), 10) || 1)),
    deliverables: normalizeDeliverables(parseJsonArrayParam(P.get('deliverables'), DEFAULT_DELIVERABLES, 'deliverables')),
    timeline: normalizeTimeline(parseJsonArrayParam(P.get('timeline'), DEFAULT_TIMELINE, 'timeline'))
  };

  // Header
  document.getElementById('apTitle').textContent = config.title;
  document.getElementById('apSubtitle').textContent = config.subtitle;
  document.getElementById('roundBadge').textContent = 'Round ' + config.round;

  const typeIcons = {
    design: '🎨', motion: '🎬', copy: '📝', dev: '⚙️', photo: '📷', brand: '✦', video: '🎥', audio: '🎵', doc: '📄'
  };
  const typeLabels = {
    design: 'Design', motion: 'Motion', copy: 'Copywriting', dev: 'Development',
    photo: 'Photography', brand: 'Branding', video: 'Video', audio: 'Audio', doc: 'Document'
  };

  // ─── Phase 1: deliverables — createElement + textContent, no innerHTML ──────
  const delivGrid = document.getElementById('delivGrid');
  config.deliverables.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'deliv-item';
    item.style.animationDelay = `${0.1 + i * 0.08}s`;

    const icon = document.createElement('div');
    icon.className = 'deliv-icon';
    icon.textContent = typeIcons[d.type] || '📄';

    const info = document.createElement('div');
    info.className = 'deliv-info';

    const name = document.createElement('div');
    name.className = 'deliv-name';
    name.textContent = d.name;

    const meta = document.createElement('div');
    meta.className = 'deliv-meta';
    meta.textContent = typeLabels[d.type] || d.type;

    info.appendChild(name);
    info.appendChild(meta);

    const statusEl = document.createElement('div');
    statusEl.className = `deliv-status status-${d.status}`;
    statusEl.textContent = STATUS_LABELS[d.status] || d.status;

    item.appendChild(icon);
    item.appendChild(info);
    item.appendChild(statusEl);
    delivGrid.appendChild(item);
  });

  // ─── Phase 1: timeline — createElement + textContent, no innerHTML ──────────
  const timeline = document.getElementById('timeline');
  config.timeline.forEach(t => {
    const item = document.createElement('div');
    item.className = 'timeline-item';

    const dot = document.createElement('div');
    dot.className = `tl-dot ${t.type}`;

    const content = document.createElement('div');
    content.className = 'tl-content';

    const text = document.createElement('div');
    text.className = 'tl-text';
    text.textContent = t.text;

    const date = document.createElement('div');
    date.className = 'tl-date';
    date.textContent = t.date;

    content.appendChild(text);
    content.appendChild(date);
    item.appendChild(dot);
    item.appendChild(content);
    timeline.appendChild(item);
  });

  // Interactive approval buttons
  let selectedAction = null;
  const feedbackSection = document.getElementById('feedbackSection');
  const submitRow = document.getElementById('submitRow');
  const btns = document.querySelectorAll('.action-btn');
  const feedbackArea = document.getElementById('feedbackArea');
  let submitInFlight = false;

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('is-selected'));
      btns.forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.classList.add('is-selected');
      btn.setAttribute('aria-pressed', 'true');
      selectedAction = btn.dataset.action;
      feedbackSection.classList.add('is-visible');
      submitRow.classList.add('is-visible');

      if (selectedAction === 'approve') {
        feedbackArea.placeholder = 'Optional: Any final notes before sign-off?';
      } else if (selectedAction === 'revisions') {
        feedbackArea.placeholder = 'Describe the changes needed — be specific about sections, colors, copy...';
      } else {
        feedbackArea.placeholder = 'Explain what needs to fundamentally change...';
      }
    });
  });

  function resetInteractionState() {
    btns.forEach(b => b.classList.remove('is-selected'));
    btns.forEach(b => b.setAttribute('aria-pressed', 'false'));
    feedbackSection.classList.remove('is-visible');
    submitRow.classList.remove('is-visible');
    selectedAction = null;
    feedbackArea.value = '';
    feedbackArea.placeholder = 'Add your feedback, revision notes, or questions...';
  }

  document.getElementById('cancelBtn').addEventListener('click', () => {
    resetInteractionState();
  });

  // ─── Phase 3: postMessage submission ────────────────────────────────────────
  const errorBar = document.getElementById('errorBar');

  function showError(msg) {
    errorBar.textContent = '⚠ ' + msg;
    errorBar.classList.add('is-visible');
    setTimeout(() => errorBar.classList.remove('is-visible'), 3000);
  }

  if (initErrors.length > 0) showError(initErrors[0]);

  // ─── Durable decision record + reload recovery ─────────────────────────────
  // postMessage is one-way and has no backend or receiver acknowledgement, so
  // every submission is also saved in this browser and made copyable for
  // manual delivery to the team.
  const decisionRecordEl = document.getElementById('decisionRecord');
  const decisionRecordText = document.getElementById('decisionRecordText');
  const decisionCopyBtn = document.getElementById('decisionCopyBtn');
  const DECISION_KEY = 'clientApproval:' + config.title + '|' + config.subtitle + '|round' + config.round;
  const ACTION_LABELS = { approve: 'Approved', revisions: 'Revisions requested', restart: 'Restart requested' };

  function loadDecision() {
    try {
      const raw = localStorage.getItem(DECISION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  function saveDecision(record) {
    try { localStorage.setItem(DECISION_KEY, JSON.stringify(record)); } catch (_) {}
  }

  function decisionSummary(record) {
    return [
      'Client decision — ' + config.title,
      config.subtitle,
      'Round ' + config.round,
      'Decision: ' + (ACTION_LABELS[record.action] || record.action),
      record.feedback ? 'Feedback: ' + record.feedback : 'Feedback: (none)',
      'Deliverables: ' + config.deliverables.map(d => d.name).join(', '),
      'Submitted: ' + record.timestamp
    ].join('\n');
  }

  function renderDecisionRecord() {
    const record = loadDecision();
    if (!record) return;
    const when = new Date(record.timestamp);
    const whenText = isNaN(when.getTime()) ? String(record.timestamp) : when.toLocaleString();
    decisionRecordText.textContent = '';
    const strong = document.createElement('strong');
    strong.textContent = ACTION_LABELS[record.action] || String(record.action);
    decisionRecordText.append('Recorded in this browser: ', strong, ' · ' + whenText);
    decisionRecordEl.classList.add('is-visible');
  }

  decisionCopyBtn.addEventListener('click', () => {
    const record = loadDecision();
    if (!record) { showError('No recorded decision to copy.'); return; }
    navigator.clipboard.writeText(decisionSummary(record)).then(() => {
      decisionCopyBtn.textContent = 'Copied ✓';
      setTimeout(() => { decisionCopyBtn.textContent = 'Copy summary'; }, 2000);
    }).catch(() => showError('Copy failed — clipboard unavailable in this embed.'));
  });

  renderDecisionRecord();

  const submitBtn = document.getElementById('submitBtn');
  function setSubmitPending(isPending) {
    submitInFlight = isPending;
    submitBtn.disabled = isPending;
    submitBtn.setAttribute('aria-busy', isPending ? 'true' : 'false');
    submitBtn.style.opacity = isPending ? '0.7' : '';
    submitBtn.style.cursor = isPending ? 'not-allowed' : '';
    submitBtn.textContent = isPending ? 'Sending...' : 'Submit Feedback';
  }

  function getSafeTargetOrigin() {
    // Wildcard '*' is never allowed — an explicit https origin is required so
    // the decision payload can only reach the intended embedding page.
    const raw = (P.get('targetOrigin') || '').trim();
    if (!raw || raw === '*') return null;

    try {
      return new URL(raw).origin;
    } catch (_) {
      return null;
    }
  }

  document.getElementById('submitBtn').addEventListener('click', () => {
    // Guard: set submitInFlight immediately to block any concurrent rapid clicks
    if (!selectedAction || submitBtn.disabled || submitInFlight) return;
    submitInFlight = true;
    submitBtn.disabled = true;

    const feedback = feedbackArea.value.trim();
    if ((selectedAction === 'revisions' || selectedAction === 'restart') && feedback.length < 10) {
      showError('Please provide at least 10 characters of feedback for this action.');
      feedbackArea.focus();
      submitInFlight = false;
      submitBtn.disabled = false;
      return;
    }

    const targetOrigin = getSafeTargetOrigin();
    if (!targetOrigin) {
      showError('Missing valid target origin. Add ?targetOrigin=https://your-domain.com');
      submitInFlight = false;
      submitBtn.disabled = false;
      return;
    }

    setSubmitPending(true);

    const payload = {
      type: 'approval-submission',
      action: selectedAction,
      feedback: feedback,
      round: config.round,
      title: config.title,
      deliverables: config.deliverables,
      timestamp: new Date().toISOString()
    };

    try {
      window.parent.postMessage(payload, targetOrigin);
    } catch (err) {
      showError('Could not send — check iframe embed permissions.');
      setSubmitPending(false);
      return;
    }

    saveDecision({ action: selectedAction, feedback: feedback, timestamp: payload.timestamp });
    renderDecisionRecord();

    const overlay = document.getElementById('successOverlay');
    const iconMap = { approve: '✅', revisions: '✏️', restart: '↩️' };
    const textMap = { approve: 'Approval Recorded', revisions: 'Revision Request Recorded', restart: 'Restart Request Recorded' };
    const subMap = {
      approve: 'Posted to the embedding page and saved in this browser — use Copy summary to confirm with the team',
      revisions: 'Your notes were posted to the embedding page and saved in this browser — use Copy summary to confirm with the team',
      restart: 'Posted to the embedding page and saved in this browser — use Copy summary to confirm with the team'
    };

    document.getElementById('successIcon').textContent = iconMap[selectedAction] || '✅';
    document.getElementById('successText').textContent = textMap[selectedAction] || 'Response Recorded';
    document.getElementById('successSub').textContent = subMap[selectedAction] || 'Saved in this browser — confirm delivery with the team';
    overlay.classList.add('is-visible');

    setTimeout(() => {
      overlay.classList.remove('is-visible');
      resetInteractionState();
      setSubmitPending(false);
    }, 3000);
  });
</script>
</body>
</html>
